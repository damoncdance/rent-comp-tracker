name: Daily snapshot

# Runs the rent-comp tracker once per day, commits the updated SQLite database
# and dashboard HTML back to the repo, and publishes the dashboard to GitHub
# Pages. Also runnable manually from the Actions tab.

on:
  schedule:
    # 13:00 UTC = 7:00 AM Central Standard Time.
    # GitHub Actions cron is UTC; schedule may run a few minutes late under load.
    - cron: '0 13 * * *'
  workflow_dispatch:        # adds a "Run workflow" button to the Actions tab

# Required permissions for: writing data back to the repo, deploying Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping runs (e.g. if a manual run and the schedule collide).
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dashboard-ready: ${{ steps.run.outputs.dashboard-ready }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # We push back to the repo from this workflow; full history isn't
          # needed but the default token has push rights.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Dependency vulnerability scan
        # Non-blocking: surfaces known CVEs in our pinned deps without
        # failing the daily snapshot if an advisory appears.
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Initialize database if missing
        run: |
          if [ ! -f data/tracker.db ]; then
            sudo apt-get install -y sqlite3
            sqlite3 data/tracker.db < schema.sql
            echo "Initialized fresh database from schema."
          else
            echo "Existing database found ($(stat -c %s data/tracker.db) bytes)."
          fi

      - name: Apply database migrations
        # Idempotent: pending migrations apply, already-applied ones skip
        # (tracked in the schema_migrations ledger). Safe to run every day.
        run: python -m migrations.runner

      - name: Run daily snapshot
        id: run
        env:
          NOTIFY_ENABLED: "true"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM:    ${{ secrets.NOTIFY_FROM }}
          NOTIFY_TO:      ${{ secrets.NOTIFY_TO }}
          # The dashboard URL is computed from the repo, so it works for any fork.
          DASHBOARD_URL:  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # xvfb-run provides a virtual display for Playwright headed mode
          # (needed to bypass Cloudflare on SecureCafe properties).
          #
          # Exit codes from daily_run:
          #   0 = all properties succeeded
          #   1 = partial failures (expected — sites go down, Cloudflare blocks)
          #   2 = unexpected system error (should fail the workflow)
          #
          # We continue on exit 1 (partial failures) so we can commit whatever
          # data we did collect, deploy the dashboard, and push. Failure
          # visibility comes from the email digest and per-property fetch_status.
          # Exit 2 (system crash) fails the workflow so we get a GitHub alert.
          xvfb-run python -m src.daily_run --verbose 2>&1 | tee /tmp/daily_run.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ge 2 ]; then
            echo "::error::daily_run crashed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "dashboard-ready=true" >> $GITHUB_OUTPUT

      - name: Annotate failures (if any)
        if: always()
        run: |
          if [ -f /tmp/daily_run.log ]; then
            FAILS=$(grep -c 'FAILED' /tmp/daily_run.log || true)
            if [ "$FAILS" -gt 0 ]; then
              DETAILS=$(grep 'FAILED' /tmp/daily_run.log | head -10)
              echo "::warning title=Property fetch failures ($FAILS)::$DETAILS"
            fi
          fi

      - name: Commit updated data and dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily snapshot: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload dashboard as Pages artifact
        if: steps.run.outputs.dashboard-ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

  deploy-pages:
    needs: snapshot
    if: needs.snapshot.outputs.dashboard-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
